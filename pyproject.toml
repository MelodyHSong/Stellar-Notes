[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-notes"
version = "1.0.0"
description = "A sleek, cosmic desktop note-taking and voice-narration workstation with Windows Explorer integration."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Melody H. Song", email = "contact@cassiopeiastudios.com" }
]
maintainers = [
    { name = "Cassiopeia Studios" }
]
requires-python = ">=3.8"
keywords = [
    "notes",
    "markdown",
    "voice-narration",
    "sapi",
    "speech-synthesis",
    "desktop-app",
    "windows-explorer",
    "tkinter"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pillow>=10.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/MelodyHSong/StellarNotes"
Repository = "https://github.com/MelodyHSong/StellarNotes"
Issues = "https://github.com/MelodyHSong/StellarNotes/issues"
