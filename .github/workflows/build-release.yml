name: Build & Release Stellar-Notes

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate multi-resolution icons (if needed)
        run: |
          python generate_icon.py

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm stellar_notes.spec

      - name: Verify executable creation
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/stellar_notes.exe")) {
            Write-Error "stellar_notes.exe was not found in dist/"
            exit 1
          }
          Write-Host "Binary built successfully: $(Get-Item dist/stellar_notes.exe | Select-Object -ExpandProperty Length) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Notes-Windows-x64
          path: dist/stellar_notes.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stellar-Notes ${{ github.ref_name }}
          files: dist/stellar_notes.exe
          generate_release_notes: true
